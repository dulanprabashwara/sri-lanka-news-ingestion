[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "sri-lanka-news-ingestion"
version = "0.1.0"
description = "Publisher-agnostic ingestion foundation for the Sri Lanka News platform"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "beautifulsoup4>=4.13,<5",
    "feedparser>=6.0.11,<7",
    "httpx>=0.28,<1",
    "pydantic-settings>=2.10,<3",
    "apscheduler>=3.10,<4",
]

[project.scripts]
ingest-daily-mirror = "ingestion.cli:main"
ingest-newsfirst = "ingestion.cli:main_newsfirst"
ingest-hiru-news-sinhala = "ingestion.cli:main_hiru_news_sinhala"
ingest-ada-derana-sinhala = "ingestion.cli:main_ada_derana_sinhala"
ingest-the-island = "ingestion.cli:main_the_island"
ingest-divaina = "ingestion.cli:main_divaina"
ingest-lankadeepa = "ingestion.cli:main_lankadeepa"
ingest-scheduler = "ingestion.cli:main_scheduler"
[project.optional-dependencies]
dev = [
    "mypy>=1.17,<2",
    "pytest>=8.4,<9",
    "ruff>=0.12,<1",
    "types-beautifulsoup4>=4.12.0.20250516",
]

[tool.hatch.build.targets.wheel]
packages = ["src/ingestion"]

[tool.pytest.ini_options]
addopts = "-ra"
testpaths = ["tests"]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF"]

[tool.mypy]
python_version = "3.12"
strict = true
files = ["src", "tests"]

[[tool.mypy.overrides]]
module = ["feedparser", "feedparser.*", "apscheduler.*"]
ignore_missing_imports = true
